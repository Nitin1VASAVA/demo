<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login Page</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      color: white;
      font-weight: bold;
      font-family: Arial, sans-serif;
    }

    .demo {
      min-height: 100vh;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background-color: pink;
    }

    .box {
      width: 900px;
      max-width: 100%;

      min-height: 600px;

      background-color: green;
      background-image: url(image4.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px;
    }

    .hello {
      width: 100%;
      max-width: 400px;

      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
    }

    input {
      width: 100%;

      padding: 15px;
      margin-bottom: 20px;

      background: transparent;
      border: 2px solid white;
      border-radius: 5px;

      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: white;
    }

    button {
      padding: 12px 30px;

      border: none;
      border-radius: 5px;

      cursor: pointer;
      font-size: 16px;
    }


    /* Tablet */

    @media (max-width: 768px) {

      .box {
        min-height: 550px;
        padding: 30px;
      }

      .hello {
        max-width: 350px;
      }

    }


    /* Mobile */

    @media (max-width: 480px) {

      .demo {
        padding: 10px;
      }

      .box {
        width: 100%;
        min-height: 100vh;

        padding: 25px 20px;
      }

      .hello {
        width: 100%;
      }

      h1 {
        font-size: 28px;
      }

      input {
        padding: 13px;
        font-size: 15px;
      }

      button {
        width: 100%;
      }

    }

  </style>

</head>


<body>

  <div class="demo">

    <div class="box">

      <div class="hello">

        <h1>Login Page</h1>

        <label for="name">Name</label>
        <input type="text" id="name" required>


        <label for="email">Email</label>
        <input type="email" id="email" required>


        <label for="password">Password</label>
        <input type="password" id="password" maxlength="10" required>


        <button type="submit">
          Submit
        </button>

      </div>

    </div>

  </div>

</body>

</html>
