<!DOCTYPE html>
<html>
<head>
    <title>Flexbox and Grid Example</title>

    <style>

        /* ===== FLEXBOX ===== */

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #222;
            color: white;
        }

        .links {
            display: flex;
            gap: 20px;
        }

        .links a {
            color: white;
            text-decoration: none;
        }


        /* ===== GRID ===== */

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .card {
            padding: 40px;
            background: lightgray;
            text-align: center;
        }

    </style>
</head>

<body>

    <!-- FLEXBOX -->
    <nav class="navbar">

        <h2>MyShop</h2>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Login</a>
        </div>

    </nav>


    <!-- GRID -->
    <section class="products">

        <div class="card">Laptop</div>
        <div class="card">Phone</div>
        <div class="card">Watch</div>

        <div class="card">Headphones</div>
        <div class="card">Keyboard</div>
        <div class="card">Mouse</div>

    </section>

</body>
</html>
